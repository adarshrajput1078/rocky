<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocky VIP Prediction Tool</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* ---------------- PLASMA RED THEME ---------------- */
        :root {
            var(--theme-main): #ff2a2a; 
            --theme-glow: #ff003c; 
            --dark-bg: #0a0303; 
            --grid-color: rgba(255, 42, 42, 0.07);
            
            --res-green: #00ff55; 
            --res-red: #ff003c; 
            --res-big: #f2cc60; 
            --res-small: #58a6ff;
        }
        
        body {
            background-color: var(--dark-bg);
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px; color: #ffffff; font-family: 'Share Tech Mono', monospace;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; user-select: none;
        }
        
        .cyber-frame { position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px; pointer-events: none; z-index: 0; }
        .cyber-frame::before, .cyber-frame::after { content: ''; position: absolute; width: 30px; height: 30px; border-color: #ff2a2a; border-style: solid; box-shadow: 0 0 10px var(--theme-glow); }
        .cyber-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; }
        .cyber-frame::after { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
        .cyber-frame .top-right { position: absolute; top: 0; right: 0; width: 30px; height: 30px; border-top: 3px solid #ff2a2a; border-right: 3px solid #ff2a2a; box-shadow: inset -2px 2px 5px rgba(255,42,42,0.2); }
        .cyber-frame .bottom-left { position: absolute; bottom: 0; left: 0; width: 30px; height: 30px; border-bottom: 3px solid #ff2a2a; border-left: 3px solid #ff2a2a; box-shadow: inset 2px -2px 5px rgba(255,42,42,0.2); }

        .screen-container { width: 100%; max-width: 360px; padding: 20px; text-align: center; position: relative; z-index: 10; display: none; }
        #login-screen { display: block; }

        h2 { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; color: #ff2a2a; text-shadow: 0 0 15px var(--theme-glow); margin-bottom: 5px;}
        .subtitle { font-size: 10px; color: #a18b8b; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }
        .app-logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px auto; display: block; box-shadow: 0 0 20px rgba(255, 42, 42, 0.4); border: 2px solid #ff2a2a; }
        
        .version-badge { font-size: 10px; color: #ff2a2a; border: 1px solid rgba(255,42,42,0.4); padding: 3px 15px; letter-spacing: 2px; display: inline-block; margin-bottom: 10px; background: rgba(255,42,42,0.08); text-shadow: 0 0 5px var(--theme-glow);}
        
        .brand-title { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; margin: 5px 0; }
        .brand-rocky { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .brand-tool { color: #ff2a2a; text-shadow: 0 0 15px var(--theme-glow); }

        .status-box { background: rgba(255, 42, 42, 0.05); border: 1px solid rgba(255, 42, 42, 0.4); color: #ff2a2a; font-size: 12px; padding: 8px 0; width: 80%; margin: 20px auto; letter-spacing: 2px; box-shadow: inset 0 0 10px rgba(255,42,42,0.1); }
        .live-dot { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; text-shadow: 0 0 10px var(--theme-glow); } 50% { opacity: 0.3; } }

        .input-section { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .input-box { width: 45%; }
        .input-box p { margin: 0 0 5px 0; font-size: 12px; color: #a18b8b; letter-spacing: 1px; }
        .input-box input { width: 100%; padding: 15px 0; font-size: 24px; font-family: 'Orbitron', sans-serif; text-align: center; background: rgba(0, 0, 0, 0.6); border: 1px solid #3d2626; border-bottom: 2px solid #ff2a2a; color: #ffffff; outline: none; transition: 0.3s; box-sizing: border-box; }
        .input-box input:focus { background: rgba(255, 42, 42, 0.1); box-shadow: 0 5px 15px rgba(255, 42, 42, 0.2); border-color: var(--theme-glow); }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .btn-cyber { width: 100%; padding: 15px; font-size: 16px; font-family: 'Orbitron', sans-serif; font-weight: 700; background: rgba(255, 42, 42, 0.08); color: #ff2a2a; border: 2px solid #ff2a2a; cursor: pointer; letter-spacing: 3px; text-transform: uppercase; transition: 0.3s; box-shadow: inset 0 0 10px rgba(255,42,42,0.1), 0 0 15px rgba(255,42,42,0.2); margin-bottom: 15px; text-shadow: 0 0 5px var(--theme-glow);}
        .btn-cyber:active { transform: scale(0.98); background: rgba(255, 42, 42, 0.2); }
        .btn-cyber:disabled { border-color: #3d2626; color: #a18b8b; box-shadow: none; cursor: not-allowed; text-shadow: none; background: transparent;}

        .period-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,42,42,0.2); padding-bottom: 10px;}
        .p-label { font-size: 10px; color: #a18b8b; letter-spacing: 1px; }
        .p-number { font-size: 14px; color: #ffffff; letter-spacing: 1px; }
        .timer-display { font-family: 'Orbitron', sans-serif; font-size: 22px; color: #ff2a2a; font-weight: bold; text-shadow: 0 0 8px var(--theme-glow);}
        
        .timer-alert { color: #ffffff !important; text-shadow: 0 0 15px var(--theme-glow); animation: heartbeat 0.5s infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .result-box { margin-top: 10px; min-height: 40px; }
        .loading-text { font-size: 12px; color: #ff2a2a; display: none; animation: blink 1s infinite; letter-spacing: 2px;}
        .final-result { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: bold; display: none; text-transform: uppercase; letter-spacing: 2px;}
        
        .res-GREEN { color: var(--res-green); text-shadow: 0 0 15px var(--res-green); }
        .res-RED { color: var(--res-red); text-shadow: 0 0 15px var(--res-red); }
        .res-BIG { color: var(--res-big); text-shadow: 0 0 15px var(--res-big); }
        .res-SMALL { color: var(--res-small); text-shadow: 0 0 15px var(--res-small); }

        .error-shake { animation: shake 0.4s; border-bottom-color: #ff0000 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } }
        
        #maintenance-screen h2 { color: #ff2a2a; text-shadow: 0 0 15px var(--theme-glow); }
        .alert-icon { font-size: 60px; margin-bottom: 20px; animation: heartbeat 1s infinite; }
    </style>
</head>
<body>

<div class="cyber-frame">
    <div class="top-right"></div>
    <div class="bottom-left"></div>
</div>

<div class="screen-container" id="maintenance-screen">
    <div class="alert-icon">⚠️</div>
    <h2>SYSTEM OFFLINE</h2>
    <div class="subtitle" id="maint-msg">UNDER SERVER MAINTENANCE</div>
</div>

<div class="screen-container" id="login-screen">
    <img src="logo.png" alt="Logo" class="app-logo" style="margin-top: 40px;">
    <h2>SYSTEM LOCKED</h2>
    <div class="subtitle">Enter API Authorization Key</div>
    <div class="input-box" style="width: 100%; margin-bottom: 30px;">
        <input type="password" id="vip-pin" placeholder="ACCESS KEY" maxlength="6" style="letter-spacing: 5px;">
    </div>
    <button class="btn-cyber" id="login-btn">INITIALIZE ▶</button>
    <p id="login-error" style="color: #ff2a2a; font-size: 12px; display: none; letter-spacing: 1px;">ERROR: UNAUTHORIZED USER</p>
</div>

<div class="screen-container" id="main-app">
    <img src="logo.png" alt="Logo" class="app-logo">
    <div class="version-badge">♦ VERSION 4.0 ♦</div>
    
    <div class="brand-title">
        <span class="brand-rocky">ROCKY VIP</span><br>
        <span class="brand-tool">TOOL</span>
    </div>
    <div class="subtitle" style="margin-bottom: 10px;">ALL GAMES CONNECTED<br>• DIRECT API SERVER •</div>

    <div class="status-box"><span class="live-dot">●</span> SYSTEM ONLINE</div>

    <div class="period-info">
        <div style="text-align: left;">
            <div class="p-label">PERIOD ID</div>
            <div class="p-number" id="period-display">Loading...</div>
        </div>
        <div style="text-align: right;">
            <div class="p-label">COUNTDOWN</div>
            <div class="timer-display" id="timer-display">00:00</div>
        </div>
    </div>

    <div class="input-section">
        <div class="input-box">
            <p>DATA 1 [TOP]</p>
            <input type="number" id="top-input" placeholder="0">
        </div>
        <div class="input-box">
            <p>DATA 2 [BTM]</p>
            <input type="number" id="bottom-input" placeholder="0">
        </div>
    </div>

    <button class="btn-cyber" id="predict-btn">ACTIVATE ▶</button>
    <div class="result-box">
        <div class="loading-text" id="loading-anim">FETCHING SERVER DATA...</div>
        <div class="final-result" id="final-result"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, child } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBTFFk_wM5Ji8Wa3kiVdn7_3kasnOZ_DPI",
        authDomain: "rockey-c164a.firebaseapp.com",
        databaseURL: "https://rockey-c164a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rockey-c164a",
        storageBucket: "rockey-c164a.firebasestorage.app",
        messagingSenderId: "996149364006",
        appId: "1:996149364006:web:7a9382e8244631f322ade7",
        measurementId: "G-YYN7MP58B0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db);
    const tg = window.Telegram.WebApp;
    tg.expand();

    let userLoggedIn = false;

    // Maintenance Listener
    onValue(ref(db, 'admin_settings/maintenance_mode'), (snapshot) => {
        const isMaintenance = snapshot.val();
        if(isMaintenance === true) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('maintenance-screen').style.display = 'block';
        } else {
            document.getElementById('maintenance-screen').style.display = 'none';
            if(userLoggedIn) {
                document.getElementById('main-app').style.display = 'block';
            } else {
                document.getElementById('login-screen').style.display = 'block';
            }
        }
    });

    // Login System
    document.getElementById('login-btn').addEventListener('click', async () => {
        const pinInput = document.getElementById('vip-pin');
        const errorMsg = document.getElementById('login-error');
        const btn = document.getElementById('login-btn');
        
        btn.innerText = "VERIFYING...";
        try {
            const snapshot = await get(child(dbRef, 'admin_settings/daily_password'));
            if (snapshot.exists()) {
                const realPassword = snapshot.val();
                if(pinInput.value === String(realPassword)) {
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    userLoggedIn = true;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                } else {
                    triggerError(pinInput, errorMsg);
                }
            } else {
                triggerError(pinInput, errorMsg);
            }
        } catch (error) {
            console.error(error);
            triggerError(pinInput, errorMsg);
        }
        btn.innerText = "INITIALIZE ▶";
    });

    function triggerError(input, msg) {
        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        input.classList.add('error-shake');
        msg.style.display = 'block';
        setTimeout(() => { input.classList.remove('error-shake'); }, 400);
    }

    // Prediction / Fetch Result System
    document.getElementById('predict-btn').addEventListener('click', async () => {
        const topInput = document.getElementById('top-input').value;
        const bottomInput = document.getElementById('bottom-input').value;
        const btn = document.getElementById('predict-btn');

        if(topInput === "" || bottomInput === "" || topInput > 9 || bottomInput > 9) {
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            alert("ENTER SINGLE DIGIT (0-9) IN BOTH FIELDS!");
            return;
        }

        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        btn.disabled = true; btn.innerText = "PROCESSING...";
        document.getElementById('final-result').style.display = 'none';
        document.getElementById('loading-anim').style.display = 'block';

        const pairKey = `${topInput}-${bottomInput}`;

        try {
            const snapshot = await get(child(dbRef, `results/${pairKey}`));
            let finalOutput = "RED"; 
            
            if (snapshot.exists()) {
                finalOutput = snapshot.val().toUpperCase();
            } else {
                if (topInput < bottomInput) finalOutput = "RED";
                else if (topInput > bottomInput) finalOutput = "GREEN";
                else if (parseInt(topInput) % 2 === 0) finalOutput = "BIG";
                else finalOutput = "SMALL";
            }

            setTimeout(() => {
                document.getElementById('loading-anim').style.display = 'none';
                const resEl = document.getElementById('final-result');
                resEl.innerText = `[ ${finalOutput} ]`;
                resEl.className = `final-result res-${finalOutput}`; 
                resEl.style.display = 'block';

                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                setTimeout(() => {
                    btn.disabled = false; btn.innerText = "ACTIVATE ▶";
                    document.getElementById('top-input').value = '';
                    document.getElementById('bottom-input').value = '';
                }, 3000);
            }, 1000);

        } catch(error) {
            console.error(error);
            alert("API ERROR: Try again.");
            btn.disabled = false; btn.innerText = "ACTIVATE ▶";
        }
    });

    // Input Validation
    function limitToOneDigit(e) {
        if (e.target.value.length > 1) e.target.value = e.target.value.slice(0, 1);
        if (e.target.value < 0) e.target.value = 0;
    }
    document.getElementById('top-input').addEventListener('input', limitToOneDigit);
    document.getElementById('bottom-input').addEventListener('input', limitToOneDigit);

    // EXACT TIMING & PERIOD BUG FIX (Using UTC for consistency)
    function updateTimerAndPeriod() {
        const now = new Date();
        const seconds = now.getUTCSeconds();
        let remainingSeconds = 59 - seconds; // Countdown from 59 to 0
        const formattedSecs = String(remainingSeconds).padStart(2, '0');
        
        // Push calculation 1 second forward to instantly sync period on 00:00
        const targetTime = new Date(now.getTime() + 1000); 
        
        const year = targetTime.getUTCFullYear();
        const month = String(targetTime.getUTCMonth() + 1).padStart(2, '0');
        const day = String(targetTime.getUTCDate()).padStart(2, '0');
        const hours = targetTime.getUTCHours();
        const minutes = targetTime.getUTCMinutes();
        
        const totalMinutes = (hours * 60) + minutes;
        const periodSuffix = 10001 + totalMinutes;
        
        document.getElementById('period-display').innerText = `${year}${month}${day}-${periodSuffix}`;
        const timerElement = document.getElementById('timer-display');
        timerElement.innerText = `00:${formattedSecs}`;

        if (remainingSeconds <= 5 && remainingSeconds > 0) {
            timerElement.classList.add('timer-alert');
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        } else {
            timerElement.classList.remove('timer-alert');
        }
    }
    setInterval(updateTimerAndPeriod, 1000);
    updateTimerAndPeriod(); 
</script>

</body>
</html>
