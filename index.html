<!DOCTYPE html>
<html lang="en">
<head>
    <!-- [Tumhara Same CSS Aur Layout Yahan Hoga... Usme Koi Change Nahi Hai] -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP AI EXPLOIT SYSTEM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;800&display=swap');
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; background-color: #050505; overflow: hidden; }
        #top-panel { background: radial-gradient(circle at center, #111 0%, #000 100%); height: 21%; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; border-bottom: 2px solid rgba(0, 255, 204, 0.3); box-shadow: 0px 5px 25px rgba(0, 255, 204, 0.15); z-index: 10; position: relative; overflow: hidden; }
        .glass-box { background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(5, 5, 5, 0.95)); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 204, 0.2); padding: 6px 12px; border-radius: 8px; text-align: center; width: 96%; max-width: 420px; box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0, 255, 204, 0.05); box-sizing: border-box; animation: slideDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        h3 { margin: 0 0 4px 0; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: 2px; color: #fff; text-transform: uppercase; text-shadow: 0 0 8px rgba(255, 255, 255, 0.5); }
        h3 span { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        input { padding: 5px 8px; border: 1px solid #333; border-radius: 4px; width: 100%; text-align: center; font-size: 12px; font-family: 'Orbitron', sans-serif; background: rgba(0, 0, 0, 0.7); color: #00ffcc; transition: all 0.3s ease; box-sizing: border-box; }
        input:focus { border: 1px solid #00ffcc; box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); outline: none; }
        input::placeholder { color: #555; font-family: 'Poppins', sans-serif; }
        button { padding: 5px 8px; font-size: 11px; font-family: 'Orbitron', sans-serif; font-weight: 800; cursor: pointer; border-radius: 4px; border: 1px solid #00ffcc; background: rgba(0, 255, 204, 0.1); color: #00ffcc; width: 100%; text-transform: uppercase; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); transition: all 0.2s; box-sizing: border-box; position: relative; overflow: hidden; }
        button::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,255,204,0.4), transparent); transition: 0.5s; }
        button:hover::before { left: 100%; }
        button:hover { background: rgba(0, 255, 204, 0.3); box-shadow: 0 0 15px rgba(0, 255, 204, 0.5); }
        button:active { transform: scale(0.95); }
        button:disabled { border-color: #444; color: #444; background: transparent; box-shadow: none; cursor: not-allowed; }
        .flex-row { display: flex; gap: 6px; margin-bottom: 4px; align-items: center; }
        .info-row { display: flex; justify-content: space-between; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 4px; border: 1px solid #222; margin-bottom: 4px; font-size: 9px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .neon-cyan { color: #00ffcc; text-shadow: 0 0 5px #00ffcc;}
        .neon-red { color: #ff2a2a; text-shadow: 0 0 5px #ff2a2a;}
        .history-row { text-align: left; font-size: 8px; color: #666; font-family: 'Orbitron', sans-serif; margin-bottom: 4px; padding-left: 2px;}
        .hist-item { background: rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.3); color: #00ffcc; padding: 1px 4px; border-radius: 2px; margin-right: 3px; display: inline-block;}
        .result-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .result-box-mini { background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; border: 1px solid rgba(0, 255, 204, 0.2); position: relative; overflow: hidden; width: 75%; justify-content: center; }
        .prediction-text { font-size: 12px; font-family: 'Orbitron', sans-serif; font-weight: 900; color: #fff; margin-left: 6px; letter-spacing: 1px; }
        .scanner-line { position: absolute; left: -100%; top: 0; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, #00ffcc, #fff, #00ffcc, transparent); box-shadow: 0 0 10px #00ffcc; display: none; z-index: 5; }
        .scanning .scanner-line { display: block; animation: laserScan 0.6s linear infinite; }
        .scanning .prediction-text { color: #00ffcc; animation: textGlitch 0.2s infinite; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes laserScan { 0% { left: -50%; } 100% { left: 150%; } }
        @keyframes textGlitch { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .badge-container { position: absolute; top: 4px; left: 8px; right: 8px; display: flex; justify-content: space-between; pointer-events: none; }
        .cyber-badge { font-size: 8px; font-weight: bold; color: #00ffcc; background: rgba(0, 0, 0, 0.8); padding: 3px 6px; border-radius: 3px; border: 1px solid rgba(0, 255, 204, 0.2); font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 4px;}
        .badge-yellow { color: #ffeb3b; border-color: rgba(255, 235, 59, 0.3); text-shadow: 0 0 4px rgba(255, 235, 59, 0.5); }
        .dot { height: 5px; width: 5px; background-color: #ff2a2a; border-radius: 50%; box-shadow: 0 0 5px #ff2a2a; animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
        #alertPopup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 999; opacity: 0; visibility: hidden; transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; }
        #alertPopup.show { opacity: 1; visibility: visible; }
        .popup-content { background: #0a0a0a; padding: 20px; border-radius: 8px; width: 80%; max-width: 280px; text-align: center; border: 1px solid #00ffcc; box-shadow: 0 0 30px rgba(0,255,204,0.2); transform: scale(0.5); transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #alertPopup.show .popup-content { transform: scale(1); }
        .popup-icon { font-size: 35px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .popup-msg { font-size: 11px; color: #ccc; margin-bottom: 15px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; line-height: 1.5;}
        .popup-btn { background: #00ffcc; color: black; padding: 8px 15px; border-radius: 4px; font-weight: 900; font-family: 'Orbitron', sans-serif; cursor: pointer; display: inline-block; font-size: 10px; text-decoration: none; border: none; }
        .tg-btn { background: #0088cc; color: white; width: 80%; margin-top: 10px; box-shadow: 0 0 10px rgba(0,136,204,0.4);}
        #toast-container { position: absolute; top: 5px; right: 10px; z-index: 100; pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
        .toast { background: rgba(0, 0, 0, 0.9); color: #00ffcc; padding: 4px 8px; border-radius: 3px; font-size: 8px; font-family: 'Orbitron', sans-serif; border-left: 2px solid #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.2); transform: translateX(120%); animation: slideIn 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slideIn { 0% { transform: translateX(120%); } 15%, 85% { transform: translateX(0); } 100% { transform: translateX(120%); } }
        #bottom-panel { background-color: #000; height: 79%; width: 100%; border-top: 1px solid #222;}
        iframe { width: 100%; height: 100%; border: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div id="alertPopup">
        <div class="popup-content">
            <div id="popupIcon" class="popup-icon">⚠️</div>
            <div id="popupMessage" class="popup-msg">SYSTEM ERROR</div>
            <!-- DYNAMIC TELEGRAM BUTTON -->
            <a id="popupTgBtn" href="#" class="popup-btn tg-btn hidden" target="_blank">CONTACT ADMIN</a><br>
            <button class="popup-btn" onclick="closePopup()" style="margin-top:10px; background:#222; color:#fff; border:1px solid #444;">DISMISS</button>
        </div>
    </div>

    <!-- TOP CONTROL PANEL (21%) -->
    <div id="top-panel">
        <div class="badge-container">
            <div class="cyber-badge"><span class="dot"></span> <span id="onlineCount">NODE: 245</span></div>
            <div class="cyber-badge badge-yellow" id="netSpeed">NET: 0.00 MB/s</div>
        </div>

        <div id="authScreen" class="glass-box" style="margin-top: 15px;">
            <h3>PREDICTION <span>AI</span></h3>
            <div class="flex-row">
                <input type="number" id="userUidInput" placeholder="ENTER GAME UID" style="width: 65%;">
                <button id="verifyBtn" onclick="verifyUid()" style="width: 35%;">SYNC</button>
            </div>
        </div>

        <div id="toolScreen" class="glass-box hidden" style="margin-top: 15px;">
            <div class="info-row">
                <div>ID: <span id="displayPeriod" class="neon-cyan">SYNCING...</span></div>
                <div>TMR: <span id="displayTimer" class="neon-red">00:00</span></div>
            </div>
            <div class="flex-row">
                <input type="number" id="num1" placeholder="N-1" min="0" max="9" style="width: 30%;">
                <input type="number" id="num2" placeholder="N-2" min="0" max="9" style="width: 30%;">
                <button id="analyzeBtn" onclick="checkPattern()" style="width: 40%;">RUN EXPLOIT</button>
            </div>
            <div class="history-row" id="historyRow">HIST: <span style="color:#444;">NO DATA YET</span></div>
            <div class="result-bar">
                <div class="result-box-mini" id="resultContainer">
                    <div class="scanner-line"></div>
                    <span style="font-size: 9px; color: #555; margin-right:5px; font-family:'Poppins', sans-serif;">OUT:</span>
                    <span id="predictionDisplay" class="prediction-text" style="color:#555;">AWAITING...</span>
                </div>
                <span style="font-size: 9px; cursor:pointer; color: #ff2a2a; font-family:'Orbitron', sans-serif; text-decoration: none; padding: 5px;" onclick="logoutTool()">[X] EXIT</span>
            </div>
        </div>
    </div>

    <!-- BOTTOM GAME PANEL (79%) -->
    <div id="bottom-panel">
        <iframe id="gameIframe" src="https://sikkimgg.com/#/register?invitationCode=481415207260"></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyB2w6_FoCuFfrSJWZGk2x3zLn6xaVwUT5I", authDomain: "rocky-tool.firebaseapp.com", databaseURL: "https://rocky-tool-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "rocky-tool" };
        const db = getDatabase(initializeApp(firebaseConfig));
        
        // DYNAMIC TELEGRAM VARIABLE
        let liveTelegramId = "Admin"; 

        // LISTEN TO TELEGRAM ID CHANGES FROM ADMIN PANELS
        onValue(ref(db, 'settings/telegram_id'), (snapshot) => {
            if (snapshot.exists() && snapshot.val().trim() !== "") {
                liveTelegramId = snapshot.val().replace('@', '').trim();
            }
        });

        // Live Link Route
        onValue(ref(db, 'settings/active_link'), (snapshot) => {
            if (snapshot.exists() && snapshot.val().trim() !== "") document.getElementById('gameIframe').src = snapshot.val().trim();
        });

        let audioCtx;
        function playSound(type) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;
            if(type === 'click') { osc.type = 'square'; osc.frequency.setValueAtTime(800, now); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
            else if (type === 'scan') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
            else if (type === 'success') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
            else if (type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(now); osc.stop(now + 0.4); }
        }

        function updateSpeed() {
            let speedDisplay = document.getElementById('netSpeed'); let baseSpeed = 4.2; 
            if (navigator.connection && navigator.connection.downlink) { baseSpeed = (navigator.connection.downlink / 8) * 0.75; } 
            else { baseSpeed = 2.0 + Math.random() * 3; }
            let fluctuation = (Math.random() * 0.5) - 0.25; let finalSpeed = Math.max(0.1, baseSpeed + fluctuation).toFixed(2);
            speedDisplay.innerText = `NET: ${finalSpeed} MB/s`;
        }
        setInterval(updateSpeed, 1500);

        let historyArray = JSON.parse(localStorage.getItem('exploit_history') || "[]");
        function updateHistoryUI() {
            let histDiv = document.getElementById('historyRow');
            if(historyArray.length === 0) { histDiv.innerHTML = `HIST: <span style="color:#444;">NO DATA YET</span>`; return; }
            let html = "HIST: "; historyArray.slice(-3).forEach(res => { html += `<span class="hist-item">${res}</span>`; }); histDiv.innerHTML = html;
        }
        function addHistory(result) { historyArray.push(result); if(historyArray.length > 3) historyArray.shift(); localStorage.setItem('exploit_history', JSON.stringify(historyArray)); updateHistoryUI(); }

        window.showPopup = function(icon, message, showTelegram, uidStr) {
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupMessage').innerHTML = message;
            let tgBtn = document.getElementById('popupTgBtn');
            if(showTelegram) {
                // HERE WE USE THE LIVE TELEGRAM ID
                tgBtn.href = `https://t.me/${liveTelegramId}?text=${encodeURIComponent("My UID: " + uidStr + " needs verification/renewal.")}`;
                tgBtn.classList.remove('hidden');
            } else tgBtn.classList.add('hidden');
            document.getElementById('alertPopup').classList.add('show');
            playSound('error');
        };
        window.closePopup = function() { document.getElementById('alertPopup').classList.remove('show'); playSound('click'); };

        window.verifyUid = async function() {
            playSound('click'); let uid = document.getElementById('userUidInput').value.trim(); let btn = document.getElementById('verifyBtn');
            if (uid === "") return showPopup("⚠️", "UID REQUIRED", false, "");
            btn.disabled = true; btn.innerText = "AUTH...";
            try {
                let expiryDate = null;
                const mSnap = await get(ref(db, 'approved_uids/' + uid));
                if (mSnap.exists()) expiryDate = mSnap.val();
                else { const gSnap = await get(ref(db, 'ghost_uids/' + uid)); if (gSnap.exists()) expiryDate = gSnap.val(); }

                setTimeout(() => {
                    btn.disabled = false; btn.innerText = "SYNC";
                    if (expiryDate) {
                        let today = new Date(); let offset = today.getTimezoneOffset() * 60000;
                        let localISO = (new Date(today - offset)).toISOString().split('T')[0];
                        if(expiryDate >= localISO) {
                            playSound('success'); document.getElementById('authScreen').classList.add('hidden'); document.getElementById('toolScreen').classList.remove('hidden');
                            updateHistoryUI(); startPeriodTimer();
                        } else showPopup("⏳", `ACCESS EXPIRED<br>VALID TILL: ${expiryDate}`, true, uid);
                    } else showPopup("🚫", "ACCESS DENIED<br>UNREGISTERED UID", true, uid);
                }, 800);
            } catch (e) { btn.disabled = false; btn.innerText = "SYNC"; showPopup("📡", "NETWORK ERROR", false, ""); }
        };

        window.checkPattern = async function() {
            playSound('click'); let n1 = document.getElementById('num1').value; let n2 = document.getElementById('num2').value;
            let resDisplay = document.getElementById('predictionDisplay'); let resContainer = document.getElementById('resultContainer'); let btn = document.getElementById('analyzeBtn');

            if(n1 === "" || n2 === "") return showPopup("⚠️", "INPUT DATA REQUIRED", false, "");

            btn.disabled = true; btn.innerText = "WORKING"; resContainer.classList.add('scanning'); 
            let loadingTexts = ["DECRYPTING...", "BYPASSING...", "ANALYZING...", "EXTRACTING...", "COMPILING..."]; let step = 0;
            let scanSoundLoop = setInterval(() => playSound('scan'), 300); let textAnim = setInterval(() => { resDisplay.innerText = loadingTexts[step % loadingTexts.length]; step++; }, 800);

            let searchKey = n1 + "-" + n2;
            try {
                const pSnap = await get(ref(db, 'patterns/' + searchKey)); let finalResult = pSnap.exists() ? pSnap.val() : "";
                setTimeout(() => {
                    clearInterval(textAnim); clearInterval(scanSoundLoop); btn.disabled = false; btn.innerText = "RUN EXPLOIT"; resContainer.classList.remove('scanning'); 
                    if(finalResult !== "") {
                        playSound('success'); resDisplay.innerText = finalResult; resDisplay.style.color = "#00ffcc"; resDisplay.style.textShadow = "0 0 10px #00ffcc"; addHistory(finalResult);
                    } else { playSound('error'); resDisplay.innerText = "NO MATCH"; resDisplay.style.color = "#ff2a2a"; resDisplay.style.textShadow = "none"; }
                }, 5000); 
            } catch (e) { clearInterval(textAnim); clearInterval(scanSoundLoop); btn.disabled = false; btn.innerText = "RUN EXPLOIT"; resContainer.classList.remove('scanning'); resDisplay.innerText = "ERROR"; }
        };

        let timerInterval;
        function startPeriodTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let now = new Date(); let mins = now.getUTCMinutes(); let hrs = now.getUTCHours();
                let periodNum = `${now.getUTCFullYear()}${String(now.getUTCMonth()+1).padStart(2,'0')}${String(now.getUTCDate()).padStart(2,'0')}1000${10001 + (hrs * 60) + mins}`;
                let remSec = 60 - now.getUTCSeconds(); if(remSec === 60) remSec = 0;
                document.getElementById('displayPeriod').innerText = periodNum; document.getElementById('displayTimer').innerText = `00:${String(remSec).padStart(2,'0')}`;
            }, 1000);
        }

        window.logoutTool = function() { playSound('click'); document.getElementById('userUidInput').value = ""; document.getElementById('toolScreen').classList.add('hidden'); document.getElementById('authScreen').classList.remove('hidden'); document.getElementById('predictionDisplay').innerText = "AWAITING..."; document.getElementById('predictionDisplay').style.color = "#555"; document.getElementById('predictionDisplay').style.textShadow = "none"; document.getElementById('num1').value = ""; document.getElementById('num2').value = ""; if(timerInterval) clearInterval(timerInterval); };
        setInterval(() => { let traffic = Math.floor(Math.random() * 899) + 100; document.getElementById('onlineCount').innerText = `NODE: ${traffic}`; }, 2500);
    </script>
</body>
</html>
