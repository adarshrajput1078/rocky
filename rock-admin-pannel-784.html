<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROCKY VIP - SMART ADMIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: #050505; color: #fff; padding: 15px; display:flex; justify-content:center; }
        
        /* Modals & Layout */
        #adminLock { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 3000; display: flex; justify-content: center; align-items: center; padding:20px;}
        .lock-box { background: #111; padding: 40px 20px; border-radius: 15px; border: 2px solid #ff4500; text-align: center; width:100%; max-width:400px; box-shadow: 0 0 30px rgba(255,69,0,0.3);}
        .admin-container { width: 100%; max-width: 1000px; background: #0a0a0a; border: 1px solid #ff4500; border-radius: 16px; padding: 25px; display: none; margin-bottom: 50px;}
        
        h1 { text-align: center; color: #ffaa00; font-size: 28px; margin-bottom: 5px; font-family: 'Orbitron', sans-serif; text-transform: uppercase;}
        .status-dot { height: 10px; width: 10px; background-color: #2ecc71; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #2ecc71; animation: pulse 1.5s infinite;}
        @keyframes pulse { 50% { opacity: 0.5; } }

        /* Responsive Grid & Forms */
        .section { background: #111; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid #ff4500; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        input, select { width: 100%; padding: 14px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 15px; border-radius: 8px; font-weight: bold; font-size:16px; transition: 0.3s;}
        input:focus { border-color: #ffaa00; outline: none; box-shadow: 0 0 10px rgba(255,170,0,0.2);}
        
        .row { display: flex; gap: 15px; flex-wrap: wrap;} .col { flex: 1; min-width: 250px;}
        
        /* Smart Accordion for 0-9 */
        details { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        summary { padding: 15px; font-weight: bold; font-size: 16px; cursor: pointer; background: #222; outline: none; color: #ffaa00; font-family: 'Orbitron', sans-serif;}
        .details-content { padding: 15px; background: #111; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; }
        .grid-item { background: #050505; padding: 10px; border: 1px solid #333; text-align:center; border-radius:8px;}
        .toggle-btn { width: 100%; padding: 10px 0; font-weight: 900; border: none; cursor: pointer; margin-top:8px; border-radius:6px; font-size:14px; transition: 0.2s;}
        .btn-skip { background: #222; color: #888; } .btn-big { background: #2ecc71; color: #000; box-shadow: 0 0 10px rgba(46,204,113,0.4);} .btn-small { background: #e74c3c; color: #fff; box-shadow: 0 0 10px rgba(231,76,60,0.4);}
        
        .bulk-btn { background: #333; color:#fff; border:none; padding:8px 15px; border-radius:5px; font-size:12px; cursor:pointer; font-weight:bold; margin-left:10px;}
        .bulk-btn:hover { background: #ffaa00; color:#000; }

        .btn-save { background: linear-gradient(90deg, #ff4500, #ffaa00); color: #000; border: none; width: 100%; padding: 18px; font-size: 20px; font-weight: 900; cursor: pointer; border-radius: 10px; font-family: 'Orbitron', sans-serif; text-transform: uppercase; box-shadow: 0 0 20px rgba(255,69,0,0.4);}
        .btn-save:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="godOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:99999; display:none; justify-content:center; align-items:center; flex-direction:column; text-align:center; padding:20px;">
        <h1 id="godTitle" style="color:#ffaa00; font-family:'Orbitron', sans-serif; font-size:30px; margin-bottom:15px;">SYSTEM DOWN</h1>
        <p id="godMsg" style="color:#ccc; font-size:16px; font-weight:bold; margin-bottom:25px;"></p>
        <div id="godTimer" style="font-size:40px; color:#ff4500; font-family:'Orbitron', sans-serif; font-weight:900; margin-bottom:20px; display:none;">00:00:00</div>
        <a id="godBtn" href="#" style="background:#2ecc71; color:#000; padding:15px 30px; font-size:18px; font-weight:bold; text-decoration:none; border-radius:8px; display:none;">DOWNLOAD VIP APK</a>
    </div>

    <div id="adminLock">
        <div class="lock-box">
            <h2 style="color: #ffaa00; font-family:'Orbitron', sans-serif; margin-bottom:15px;">ADMIN AUTH</h2>
            <input type="password" id="adminPin" maxlength="4" placeholder="Enter 4-Digit PIN">
            <button class="btn-save" onclick="unlockAdmin()" style="font-size: 16px; padding: 15px;">LOGIN TO PANEL</button>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <h1>ROCKY VIP</h1>
        <div style="text-align:center; font-size:12px; color:#aaa; margin-bottom:25px; font-weight:bold;">
            <span class="status-dot"></span> SERVER ONLINE & SYNCED
        </div>

        <div class="section">
            <h3 style="color:#ffaa00; margin-bottom:15px; font-family:'Orbitron', sans-serif;">⚙️ SYSTEM CONFIGURATION</h3>
            <div class="row">
                <div class="col"><label>App Access Password</label><input type="text" id="webPass" placeholder="e.g. 1122"></div>
                <div class="col"><label>VIP Tool Password</label><input type="text" id="toolPass" placeholder="e.g. VIP888"></div>
            </div>
            <label>Handwritten PDF Link</label><input type="text" id="pdfLink" placeholder="Google Drive / Mediafire Link">
            <div class="row">
                <div class="col"><label>Telegram Link</label><input type="text" id="tgLink"></div>
                <div class="col"><label>Instagram Link</label><input type="text" id="igLink"></div>
            </div>
            <label>Manager Contact Link (Bottom)</label><input type="text" id="managerLink" placeholder="https://t.me/yourusername">
        </div>

        <div class="section" id="gridWrapper">
            <h3 style="color:#ffaa00; margin-bottom:15px; font-family:'Orbitron', sans-serif;">📊 SMART RESULT GENERATOR</h3>
            <p style="font-size:12px; color:#888; margin-bottom:15px;">Click on a 'Top Number' row to expand and set results.</p>
            <div id="gridBody"></div>
        </div>

        <button class="btn-save" onclick="saveAdminData()">🚀 PUBLISH TO LIVE SERVER</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBTFFk_wM5Ji8Wa3kiVdn7_3kasnOZ_DPI", authDomain: "rockey-c164a.firebaseapp.com", databaseURL: "https://rockey-c164a-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "rockey-c164a" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- GOD MODE INTERCEPTOR ---
        onValue(ref(db, 'RockyVIPSystem/devControls'), (snapshot) => {
            if(snapshot.exists()) {
                let devData = snapshot.val();
                let overlay = document.getElementById("godOverlay");
                if(devData.mode === 'maintenance' || devData.mode === 'apk') {
                    overlay.style.display = "flex";
                    document.getElementById("godTitle").innerText = devData.mode === 'maintenance' ? "🛠️ MAINTENANCE" : "🚨 SYSTEM MOVED";
                    document.getElementById("godMsg").innerHTML = devData.mode === 'maintenance' ? "System is under maintenance." : "Admin Panel moved to APK.";
                } else overlay.style.display = "none";
            }
        });

        // --- ADMIN LOGIN LOGIC ---
        window.unlockAdmin = async function() {
            const pin = document.getElementById('adminPin').value;
            const snap = await get(ref(db, 'RockyVIPSystem/master/adminPin'));
            let livePin = snap.exists() ? snap.val() : "9999";
            if(pin === livePin) {
                document.getElementById('adminLock').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadData();
            } else alert("❌ WRONG PIN");
        };

        // --- SMART GRID GENERATOR ---
        const states = ['SKIP', 'BIG', 'SMALL'];
        const gridBody = document.getElementById('gridBody');
        for (let t = 0; t <= 9; t++) {
            let html = `
            <details>
                <summary>Top Number: ${t} 
                    <button class="bulk-btn" onclick="bulkSet(${t}, 1, event)">All BIG</button>
                    <button class="bulk-btn" onclick="bulkSet(${t}, 2, event)">All SMALL</button>
                    <button class="bulk-btn" onclick="bulkSet(${t}, 0, event)">Reset</button>
                </summary>
                <div class="details-content">
                    <div class="grid-container">`;
            for (let b = 0; b <= 9; b++) {
                html += `<div class="grid-item">
                            <div style="font-size:14px; font-weight:900; color:#888;">${t} ▼ ${b}</div>
                            <button id="btn_${t}_${b}" class="toggle-btn btn-skip" data-state="0" onclick="toggleState(${t}, ${b})">SKIP</button>
                         </div>`;
            }
            gridBody.innerHTML += html + `</div></div></details>`;
        }

        window.toggleState = function(t, b) {
            const btn = document.getElementById(`btn_${t}_${b}`);
            let next = (parseInt(btn.getAttribute('data-state')) + 1) % 3;
            updateBtn(btn, next);
        };

        window.bulkSet = function(t, stateIndex, event) {
            event.preventDefault(); // Prevents accordion from closing
            for(let b=0; b<=9; b++) {
                let btn = document.getElementById(`btn_${t}_${b}`);
                updateBtn(btn, stateIndex);
            }
        };

        function updateBtn(btn, stateIndex) {
            btn.setAttribute('data-state', stateIndex); 
            btn.innerText = states[stateIndex];
            btn.className = 'toggle-btn ' + (stateIndex === 1 ? 'btn-big' : (stateIndex === 2 ? 'btn-small' : 'btn-skip'));
        }

        // --- LOAD & SAVE DATA ---
        async function loadData() {
            const snap = await get(ref(db, 'RockyVIPSystem'));
            if (snap.exists()) {
                let d = snap.val();
                if(d.passwords) { document.getElementById('webPass').value = d.passwords.web || ""; document.getElementById('toolPass').value = d.passwords.tool || ""; }
                if(d.links) { document.getElementById('tgLink').value = d.links.tg || ""; document.getElementById('igLink').value = d.links.ig || ""; document.getElementById('managerLink').value = d.links.manager || ""; document.getElementById('pdfLink').value = d.links.pdf || ""; }
                if(d.predictions) {
                    for (const [key, result] of Object.entries(d.predictions)) {
                        let [t, b] = key.split('_');
                        const btn = document.getElementById(`btn_${t}_${b}`);
                        if(btn) {
                            let state = result === 'BIG' ? 1 : (result === 'SMALL' ? 2 : 0);
                            updateBtn(btn, state);
                        }
                    }
                }
            }
        }

        window.saveAdminData = async function() {
            let btn = document.querySelector(".btn-save:last-child");
            btn.innerText = "UPLOADING..."; btn.disabled = true;

            let predictions = {};
            for (let t=0; t<=9; t++) for (let b=0; b<=9; b++) {
                const st = parseInt(document.getElementById(`btn_${t}_${b}`).getAttribute('data-state'));
                if (st !== 0) predictions[`${t}_${b}`] = states[st];
            }
            await set(ref(db, 'RockyVIPSystem/passwords/web'), document.getElementById('webPass').value);
            await set(ref(db, 'RockyVIPSystem/passwords/tool'), document.getElementById('toolPass').value);
            await set(ref(db, 'RockyVIPSystem/links/tg'), document.getElementById('tgLink').value);
            await set(ref(db, 'RockyVIPSystem/links/ig'), document.getElementById('igLink').value);
            await set(ref(db, 'RockyVIPSystem/links/manager'), document.getElementById('managerLink').value);
            await set(ref(db, 'RockyVIPSystem/links/pdf'), document.getElementById('pdfLink').value);
            await set(ref(db, 'RockyVIPSystem/predictions'), predictions);
            
            alert("🚀 System Live!");
            btn.innerText = "🚀 PUBLISH ALL TO SERVER"; btn.disabled = false;
        };
    </script>
</body>
</html>
